name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spectrum:
    name: Spectrum analyser (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - run: python -m unittest discover -s tests -v

  logic:
    name: Widget logic (QML)
    runs-on: ubuntu-latest
    # Arch, like Omarchy, so the tests run against the same Qt the shell uses.
    # The container runs as root, so installing packages needs no privilege
    # escalation.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm qt6-declarative
      - run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -input tests/tst_logic.qml
